id = "inon.counting-sheep"
name = "Counting Sheep"
version = "0.1.0"
min_herdr_version = "0.7.5"
description = "Show live Space and Agent indexes and jump to the last tab, Space, or Agent."
platforms = ["linux", "macos"]

[[startup]]
command = ["sh", "run.sh", "refresh"]

[[actions]]
id = "refresh"
title = "Refresh Counting Sheep indexes"
command = ["sh", "run.sh", "refresh"]

[[actions]]
id = "last-tab"
title = "Focus last tab"
command = ["sh", "run.sh", "last-tab"]

[[actions]]
id = "last-workspace"
title = "Focus last Space"
command = ["sh", "run.sh", "last-workspace"]

[[actions]]
id = "last-agent"
title = "Focus last Agent"
command = ["sh", "run.sh", "last-agent"]

[[events]]
on = "workspace.created"
command = ["sh", "run.sh", "refresh"]

[[events]]
on = "workspace.moved"
command = ["sh", "run.sh", "refresh"]

[[events]]
on = "workspace.closed"
command = ["sh", "run.sh", "refresh"]

[[events]]
on = "tab.created"
command = ["sh", "run.sh", "refresh"]

[[events]]
on = "tab.moved"
command = ["sh", "run.sh", "refresh"]

[[events]]
on = "tab.closed"
command = ["sh", "run.sh", "refresh"]

[[events]]
on = "pane.created"
command = ["sh", "run.sh", "refresh"]

[[events]]
on = "pane.moved"
command = ["sh", "run.sh", "refresh"]

[[events]]
on = "pane.closed"
command = ["sh", "run.sh", "refresh"]

[[events]]
on = "pane.exited"
command = ["sh", "run.sh", "refresh"]

[[events]]
on = "pane.agent_detected"
command = ["sh", "run.sh", "refresh"]

[[events]]
on = "pane.agent_status_changed"
command = ["sh", "run.sh", "refresh"]
